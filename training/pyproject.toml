[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "felstm-training"
version = "0.1.0"
description = "FE-LSTM stage 2: LSTM training on the generated database and weight export (TensorFlow / Keras 3)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aymen Danoun" }]
requires-python = ">=3.10"
# Dependencies are managed by conda: see ../environment.yml

[tool.setuptools.packages.find]
where = ["src"]
