[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "felstm-database-generation"
version = "0.1.0"
description = "FE-LSTM stage 1: RVE geometry (microgen) and micro-scale simulations (fedoo, simcoon) producing strain-stress histories"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aymen Danoun" }]
requires-python = ">=3.10"
# Dependencies are managed by conda: see ../environment.yml

[tool.setuptools.packages.find]
where = ["src"]
