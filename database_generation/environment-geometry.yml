# Geometry environment for stage 1: microgen builds the RVE and writes its mesh file.
# Separate from felstm because microgen's conda-forge build needs Python < 3.12 and its PyPI build
# would downgrade numpy / pyvista / VTK in felstm (risk for the compiled simcoon and fedoo).
# The micro-simulations themselves run in felstm and only read the mesh file.
name: felstm-geometry
channels:
  - conda-forge
dependencies:
  - python=3.11
  - microgen=1.3.1
  - pyyaml
  - pytest
