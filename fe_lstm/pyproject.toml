[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fe-lstm"
version = "0.1.0"
description = "FE-LSTM stage 3: trained LSTM surrogates used as constitutive laws in Fedoo finite element simulations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aymen Danoun" }]
requires-python = ">=3.10"
# Dependencies are managed by conda: see ../environment.yml

[tool.setuptools.packages.find]
where = ["src"]
